name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android SDK parts
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-30" "build-tools;30.0.3"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'app/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug -Pvc=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
