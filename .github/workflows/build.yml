name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app_src/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Flutter android project
        run: flutter create --org com.example --project-name autoaccept --platforms=android .

      - name: Apply app files
        run: |
          D=android/app/src/main/kotlin/com/example/autoaccept
          mkdir -p $D android/app/src/main/res/xml android/app/src/main/res/values
          cp app_src/pubspec.yaml pubspec.yaml
          cp app_src/lib/main.dart lib/main.dart
          rm -rf test
          cp android_overlay/*.kt $D/
          cp android_overlay/accessibility_config.xml android/app/src/main/res/xml/
          cp android_overlay/acc_strings.xml android/app/src/main/res/values/
          python3 scripts/patch_manifest.py
          printf "org.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.daemon=false\n" >> android/gradle.properties

      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: AutoAccept-APK
          path: build/app/outputs/flutter-apk/app-release.apk
